spring:
  # ⚠️ 运行环境（做题容器内）：MySQL 与 Redis 由【宿主机的 Docker】提供，容器里没有 docker。
  #   不要 apt-get install、不要 docker compose、不要下载数据库包。容器内连宿主一律走
  #   host.docker.internal（本文件默认值即为此）；运行时也会被环境变量
  #   SPRING_DATASOURCE_URL / REDIS_HOST 覆盖。表已建好（见 doc/schema/），只写业务代码，不碰建表。
  # JDBC 数据源（MyBatis-Plus 走阻塞 JDBC；DB_URL 需为完整 JDBC URL（如 jdbc:mysql://host:3306/db））
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 注意：characterEncoding 只能写 utf8 —— Connector/J 不认 utf8mb4（它不是 JVM 字符集名），
    # 写了会抛 "Unsupported character encoding 'utf8mb4'"。utf8 会被 Connector/J 映射到 utf8mb4。
    url: ${DB_URL:jdbc:mysql://host.docker.internal:3306/any_17_hwaste?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      pool-name: some-pro-hikari
      # 连接池大小需与 Schedulers.boundedElastic() 的实际并发匹配：
      # 池太小会让 boundedElastic 线程排队等连接，池太大则占用过多 MySQL 连接。
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:host.docker.internal}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}

logging:
  level:
    com.somepro: debug
